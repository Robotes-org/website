<style>
  :root {
    --bg: var(--rb-pizarra);
    --text: var(--rb-blanco);
    --text-2: var(--rb-bruma);
    --line: color-mix(in srgb, var(--rb-blanco) 22%, transparent);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    padding: var(--rb-space-3);
    background: var(--bg); color: var(--text);
    font-family: var(--rb-font-texto);
    line-height: var(--rb-leading-texto);
  }
  form { width: min(100%, 22rem); display: grid; gap: var(--rb-space-2); }
  .eyebrow {
    margin: 0;
    font-family: var(--rb-font-titulo); font-weight: 600;
    font-size: var(--rb-text-xs); letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-2);
  }
  h1 {
    margin: 0 0 var(--rb-space-1);
    font-family: var(--rb-font-titulo); font-weight: 600;
    font-size: var(--rb-text-2xl); line-height: var(--rb-leading-titulo);
    letter-spacing: -0.015em;
  }
  input, button {
    min-height: 48px; width: 100%;
    border-radius: var(--rb-radio);
    font: inherit; font-size: var(--rb-text-base);
  }
  input {
    padding: 0 var(--rb-space-2);
    background: transparent; color: var(--text);
    border: 2px solid var(--line);
  }
  input:focus-visible { outline: none; border-color: var(--rb-amarillo-chispa); }
  button {
    border: 0; cursor: pointer;
    font-family: var(--rb-font-titulo); font-weight: 600;
    background: var(--rb-amarillo-chispa); color: var(--rb-pizarra);
  }
  button:hover { background: var(--rb-blanco); }
  button:disabled { opacity: 0.6; cursor: progress; }
  #status { min-height: 1.6em; margin: 0; color: var(--text-2); font-size: var(--rb-text-sm); }
</style>

<body>
<form id="unlock" autocomplete="off">
  <p class="eyebrow">Taller de Robótica</p>
  <h1>Presentación</h1>
  <input id="password" type="password" placeholder="Contraseña" aria-label="Contraseña" autofocus required>
  <button id="open" type="submit">Abrir</button>
  <p id="status" role="status"></p>
</form>

<script>
(function () {
  "use strict";

  // Everything under data/ is AES-GCM ciphertext: 12-byte IV followed by the
  // sealed bytes. The key comes from the password via PBKDF2; the salt and the
  // iteration count are public and live in data/meta.json.
  var form = document.getElementById("unlock");
  var input = document.getElementById("password");
  var button = document.getElementById("open");
  var status = document.getElementById("status");

  function fetchBytes(path) {
    return fetch(path, { cache: "no-cache" }).then(function (r) {
      if (!r.ok) throw new Error("fetch " + path + " " + r.status);
      return r.arrayBuffer();
    });
  }

  function b64ToBytes(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function deriveKey(password, meta) {
    var enc = new TextEncoder().encode(password);
    return crypto.subtle.importKey("raw", enc, "PBKDF2", false, ["deriveBits"])
      .then(function (base) {
        return crypto.subtle.deriveBits(
          { name: "PBKDF2", hash: "SHA-256", salt: b64ToBytes(meta.salt), iterations: meta.iterations },
          base, 512);
      })
      .then(function (bits) {
        // First half is the AES key; the second half only matters to the build script.
        return crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-GCM", false, ["decrypt"]);
      });
  }

  function open(key, buf) {
    return crypto.subtle.decrypt(
      { name: "AES-GCM", iv: new Uint8Array(buf, 0, 12) }, key, new Uint8Array(buf, 12));
  }

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    button.disabled = true;
    status.textContent = "Abriendo…";
    var key, manifest;

    fetchBytes("data/meta.json")
      .then(function (buf) { return deriveKey(input.value, JSON.parse(new TextDecoder().decode(buf))); })
      .then(function (k) { key = k; return fetchBytes("data/manifest.bin"); })
      .then(function (buf) {
        return open(key, buf).catch(function () { throw new Error("wrong-password"); });
      })
      .then(function (plain) {
        manifest = JSON.parse(new TextDecoder().decode(plain));
        var done = 0, total = manifest.media.length;
        status.textContent = "Cargando fotos y videos… 0 de " + total;
        return Promise.all(manifest.media.map(function (m) {
          return fetchBytes("data/" + m.id + ".bin")
            .then(function (buf) { return open(key, buf); })
            .then(function (plain) {
              done++;
              status.textContent = "Cargando fotos y videos… " + done + " de " + total;
              // The player picks photo vs. video by extension, so the blob URL
              // carries one in its fragment.
              return URL.createObjectURL(new Blob([plain], { type: m.mime })) + "#m." + m.ext;
            });
        }));
      })
      .then(function (urls) {
        var html = manifest.html.replace("\"__PPT_MEDIA__\"", JSON.stringify(urls));
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function (err) {
        button.disabled = false;
        input.select();
        status.textContent = err.message === "wrong-password"
          ? "La contraseña no coincide. Prueba de nuevo."
          : "No pude cargar la presentación. Revisa la conexión y prueba de nuevo.";
        if (err.message !== "wrong-password") console.error(err);
      });
  });
})();
</script>
</body>
